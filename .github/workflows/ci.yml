name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci          # credencial desechable del contenedor de CI, no es un secreto
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    # Construye la imagen (sin publicarla), la arranca contra Postgres y consulta /health
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci          # credencial desechable del contenedor de CI, no es un secreto
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Construir la imagen
        run: docker build -t api-mercado:ci .
      - name: Arrancar el contenedor (migra + seed) y consultar /health
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci \
            -e AUTO_SEED=true -e PORT=8000 api-mercado:ci
          for i in $(seq 1 60); do
            if body=$(curl -fsS http://127.0.0.1:8000/health); then
              echo "health: $body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            fi
            sleep 2
          done
          echo "La API no quedó sana a tiempo"
          docker logs api
          exit 1
